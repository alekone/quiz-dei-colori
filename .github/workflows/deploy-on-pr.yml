name: Deploy on PR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST || '92.113.28.128' }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT || '65002' }}
        run: |
          mkdir -p ~/.ssh
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "HOSTINGER_SSH_KEY secret is empty."
            exit 1
          fi
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger_key
          sed -i 's/\r$//' ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          if ! ssh-keygen -y -f ~/.ssh/hostinger_key >/dev/null 2>&1; then
            echo "HOSTINGER_SSH_KEY is not a valid unencrypted private key."
            exit 1
          fi
          ssh-keyscan -p "$REMOTE_PORT" "$REMOTE_HOST" >> ~/.ssh/known_hosts || true

      - name: Deploy
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER || 'u945451001' }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST || '92.113.28.128' }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT || '65002' }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR || 'domains/test.mininno.com/public_html/quiz-colori' }}
          NEXT_PUBLIC_BASE_PATH: /quiz-colori
          NEXT_PUBLIC_ASSET_PREFIX: /quiz-colori/
        run: SSH_KEY="$HOME/.ssh/hostinger_key" npm run deploy
